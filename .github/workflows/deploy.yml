name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  beget:
    name: Beget VPS
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Need Beget secrets
        id: gate
        env:
          HOST: ${{ secrets.BEGET_HOST }}
          KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Секреты BEGET_HOST / BEGET_SSH_KEY не заданы — выкладка на сервере через rastudio-deploy."
          fi
      - if: steps.gate.outputs.skip != 'true'
        name: SSH deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd /var/www/rastudio
            stuck=$(ps -eo pid,etimes,cmd | awk '/[b]eget-deploy\.sh/ && $2+0 > 120 {print $1}')
            if [ -n "$stuck" ]; then
              echo "снимаю зависшую выкладку"
              kill $stuck 2>/dev/null || true
              pkill -f '/var/www/rastudio/public/media/imported' 2>/dev/null || true
              sleep 1
              rm -f /tmp/rastudio-deploy.lock
              rm -rf /var/www/rastudio/.build-stage || true
            fi
            if ! ps -eo cmd | grep -E '[b]eget-deploy\.sh|[v]ite build|[w]ith-app-env\.mjs vite' >/dev/null; then
              echo "сборки нет — снимаю замок прошлой"
              rm -f /tmp/rastudio-deploy.lock
              rm -rf /var/www/rastudio/.build-stage
            fi
            git fetch origin main && git reset --hard origin/main
            ps -eo pid,etimes,cmd | awk '/beget-deploy\.sh|vite build|with-app-env\.mjs vite/ && !/awk/ && $2+0 > 2700 {print $1}' | while read -r pid; do
              echo "снимаю зависшую сборку $pid"
              kill "$pid" 2>/dev/null || true
              echo 1 >> /tmp/rastudio-deploy.hung
            done
            sleep 1
            if [ -f /tmp/rastudio-deploy.hung ]; then
              rm -f /tmp/rastudio-deploy.hung /tmp/rastudio-deploy.lock
              echo "зависшая сборка снята"
            elif [ -f /tmp/rastudio-deploy.lock ]; then
              age=$(( $(date +%s) - $(stat -c %Y /tmp/rastudio-deploy.lock 2>/dev/null || echo 0) ))
              if [ "$age" -lt 2400 ]; then
                echo "сборка уже идёт (${age}s), вторую не стартую"
                exit 0
              fi
              rm -f /tmp/rastudio-deploy.lock
            fi
            env RA_DEPLOY_REEXEC=1 RA_DEPLOY_BG=1 bash scripts/beget-deploy.sh --force

  production:
    name: Vercel production
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Need Vercel secrets
        id: gate
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ORG" ] || [ -z "$PROJECT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Секреты Vercel не заданы — выкладка пропущена."
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - if: steps.gate.outputs.skip != 'true'
        name: Pull Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.gate.outputs.skip != 'true'
        name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"
      - if: steps.gate.outputs.skip != 'true'
        name: Deploy
        id: ship
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Выложено: $url"
      - if: steps.gate.outputs.skip != 'true' && steps.ship.outputs.url != ''
        name: Smoke
        env:
          URL: ${{ steps.ship.outputs.url }}
        run: |
          set -euo pipefail
          code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 30 -A "rastudio-monitor" "$URL")
          echo "GET $URL → $code"
          test "$code" = "200"
