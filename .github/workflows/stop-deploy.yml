name: Stop Beget build

on:
  workflow_dispatch:

jobs:
  stop:
    name: Stop vite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH stop
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set +e
            pm2 stop rastudio-deploy
            touch /tmp/rastudio-deploy.lock
            for pid in $(pgrep -f /var/www/rastudio/.build-stage || true); do
              kill "$pid" 2>/dev/null
            done
            sleep 1
            for pid in $(pgrep -f /var/www/rastudio/.build-stage || true); do
              kill -9 "$pid" 2>/dev/null
            done
            rm -rf /var/www/rastudio/.build-stage
            echo "[stop] rastudio-deploy stopped, stage removed, live :3000 not touched"
            ss -ltnp | grep 3000 || true
            pgrep -af vite || echo no-vite
            pm2 list
            exit 0
