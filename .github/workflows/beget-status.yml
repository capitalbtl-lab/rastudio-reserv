name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            cd /var/www/rastudio
            node --input-type=module <<'EOF'
            import { register } from "node:module";
            import { pathToFileURL } from "node:url";
            import { readFileSync } from "node:fs";
            register(pathToFileURL("/var/www/rastudio/scripts/ts-ext-hook.mjs"));
            const { token, request } = await import(pathToFileURL("/var/www/rastudio/src/data/alfacrm.ts").href);
            const raw = JSON.parse(readFileSync("storage/dossiers.json", "utf8"));
            const t = await token();
            const ids = [8714, 9286];
            for (const id of ids) {
              const d = (raw.items || []).find((x) => Number(x.crmId) === id);
              console.log(JSON.stringify({ disk: id, fio: d?.child?.fio || "", study: d?.extras?.is_study ?? null, removed: d?.extras?.removed ?? null, status: d?.status || "", branchId: d?.branchId || 0 }));
            }
            const bodies = (id) => [
              ["id-page", { id, page: 0 }],
              ["id-size1", { id, page: 0, pageSize: 1 }],
              ["id-size10", { page: 0, pageSize: 10, id }],
              ["client-rem1", { id, is_study: 1, removed: 1, page: 0 }],
              ["client", { id, is_study: 1, page: 0 }],
              ["lead", { id, is_study: 0, page: 0 }],
              ["both", { id, is_study: 2, removed: 1, page: 0 }],
            ];
            for (const id of ids) {
              for (const [name, body] of bodies(id)) {
                try {
                  const json = await request(`/v2api/1/customer/index`, body, t);
                  const items = Array.isArray(json?.items) ? json.items : [];
                  const hit = items.find((x) => Number(x.id) === id) || null;
                  const top = items[0];
                  console.log(JSON.stringify({
                    id, name, total: json?.total, count: json?.count, n: items.length, topId: top ? top.id : null,
                    hit: hit ? { name: hit.name, is_study: hit.is_study, removed: hit.removed, balance: hit.balance, branch_ids: hit.branch_ids } : null,
                  }));
                } catch (e) {
                  console.log(JSON.stringify({ id, name, err: String(e && e.message || e).slice(0, 220) }));
                }
              }
            }
            EOF
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            exit 0
