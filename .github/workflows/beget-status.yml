name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            echo "=== time ==="
            date -u
            echo "=== git ==="
            cd /var/www/rastudio
            git rev-parse --short HEAD
            git log -1 --oneline
            echo "=== live stamp ==="
            cat .output/.deploy-rev 2>/dev/null | cut -c1-7
            cat .deploy-rev 2>/dev/null | cut -c1-7
            echo "=== lock ==="
            ls -l /tmp/rastudio-deploy.lock 2>/dev/null || echo no-lock
            echo "=== stage ==="
            ls -d /var/www/rastudio/.build-stage 2>/dev/null || echo no-stage
            echo "=== mem ==="
            free -h | head -2
            nproc
            echo "=== pm2 ==="
            pm2 jlist | python3 -c "import json,sys; d=json.load(sys.stdin);
            [print(p.get('name'), p.get('pm2_env',{}).get('status'), p.get('pid')) for p in d]"
            echo "=== procs ==="
            ps aux | awk '/node|npm|vite/ && !/awk/ {print $2,$3,$4,$11,$12,$13}' | head -20
            echo "=== log tail ==="
            tail -n 40 /tmp/rastudio-deploy.bg.log 2>/dev/null || echo no-log
            echo "=== pm2 err ==="
            pm2 logs rastudio --nostream --lines 40 --err 2>/dev/null | tail -40
            echo "=== node log ==="
            tail -n 40 /tmp/rastudio-node.log 2>/dev/null || echo no-node-log
            echo "=== local ==="
            curl -sS -o /tmp/local.html -w "local:%{http_code}\n" --max-time 8 http://127.0.0.1:3000/ || echo localfail
            head -c 300 /tmp/local.html 2>/dev/null; echo
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            echo "=== step7 groups api ==="
            cat > /tmp/ra-groups.mjs <<'NODE'
            import { request, token } from "/var/www/rastudio/src/data/alfacrm.ts";
            const tok = await token();
            const branch = 1;
            async function page(path, body) {
              const json = await request(path, { ...body, page: 0, pageSize: 5 }, tok);
              const o = json && typeof json === "object" ? json : {};
              const items = Array.isArray(o.items) ? o.items : [];
              return { total: o.total ?? o.count ?? items.length, n: items.length, first: items[0] || null, keys: items[0] ? Object.keys(items[0]) : [] };
            }
            const active = await page(`/v2api/${branch}/group/index`, { removed: 0 });
            const archived = await page(`/v2api/${branch}/group/index`, { removed: 2 });
            const gid = Number(archived.first?.id || active.first?.id || 0);
            let cgi = null;
            if (gid) {
              const pack = await page(`/v2api/${branch}/cgi/index?group_id=${gid}`, { group_id: gid });
              const row = pack.first || {};
              cgi = {
                gid,
                total: pack.total,
                n: pack.n,
                keys: pack.keys,
                hasCustomerId: Object.prototype.hasOwnProperty.call(row, "customer_id"),
                customerIdType: row.customer_id == null ? "empty" : typeof row.customer_id,
                hasGroupId: Object.prototype.hasOwnProperty.call(row, "group_id"),
                hasB: Object.prototype.hasOwnProperty.call(row, "b_date"),
                hasE: Object.prototype.hasOwnProperty.call(row, "e_date"),
              };
            }
            const cust = await page(`/v2api/${branch}/customer/index`, { is_study: 1, removed: 2 });
            const c = cust.first || {};
            const gids = c.group_ids;
            console.log(JSON.stringify({
              activeGroups: active.total,
              archivedGroups: archived.total,
              cgi,
              customerKeysHas: {
                group_ids: Object.prototype.hasOwnProperty.call(c, "group_ids"),
                groups: Object.prototype.hasOwnProperty.call(c, "groups"),
                group_id: Object.prototype.hasOwnProperty.call(c, "group_id"),
              },
              groupIdsType: gids == null ? "empty" : Array.isArray(gids) ? `array:${gids.length}` : typeof gids,
            }));
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-groups.mjs
            exit 0
