name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            cd /var/www/rastudio
            node --input-type=module <<'EOF'
            import { copyFileSync, readFileSync, renameSync, writeFileSync } from "node:fs";
            const path = "storage/dossiers.json";
            const raw = JSON.parse(readFileSync(path, "utf8"));
            let toLead = 0, toStudy = 0, kept = 0, other = 0;
            for (const d of raw.items || []) {
              if (String(d.status || "") !== "архив") continue;
              const ex = d.extras || {};
              const study = ex.is_study === "" || ex.is_study == null ? NaN : Number(ex.is_study);
              const removed = String(ex.removed ?? "");
              const rec = String(ex.recheckArchive || "");
              if (removed === "2" || rec === "1") { kept++; continue; }
              if (study === 0) { d.status = "лид"; toLead++; continue; }
              if (study === 1) { d.status = "учится"; toStudy++; continue; }
              other++;
            }
            const changed = toLead + toStudy;
            if (changed) {
              copyFileSync(path, "storage/dossiers.json.bak-status-word");
              const tmp = path + ".tmp-status-word";
              writeFileSync(tmp, JSON.stringify(raw));
              renameSync(tmp, path);
            }
            console.log(JSON.stringify({ toLead, toStudy, kept, other, changed }));
            EOF
            pm2 restart rastudio rastudio-history --update-env >/tmp/ra-restart-status.log 2>&1 || true
            echo restarted
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            exit 0
