name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            cd /var/www/rastudio
            node --input-type=module <<'EOF'
            import { readFileSync } from "node:fs";
            const raw = JSON.parse(readFileSync("storage/dossiers.json", "utf8"));
            const items = raw.items || [];
            const seen = new Map();
            let noCrm = 0;
            for (const d of items) {
              const id = Number(d.crmId) || 0;
              if (!id) { noCrm++; continue; }
              const st = String(d.status || "");
              const rem = String(d.extras?.removed ?? "");
              const study = String(d.extras?.is_study ?? "");
              const rec = String(d.extras?.recheckArchive || "") === "1";
              const prev = seen.get(id) || { status: "", removed: "", study: "", rec: false };
              if (!prev.status) prev.status = st;
              if (!prev.removed) prev.removed = rem;
              if (prev.study === "") prev.study = study;
              prev.rec = prev.rec || rec;
              if (st === "архив") prev.status = "архив";
              if (rem === "2") prev.removed = "2";
              if (study === "2") prev.study = "2";
              seen.set(id, prev);
            }
            let statusArch = 0, removed2 = 0, study2 = 0, recheck = 0, any = 0;
            const byStatus = {};
            for (const prev of seen.values()) {
              byStatus[prev.status] = (byStatus[prev.status] || 0) + 1;
              const a = prev.status === "архив" || prev.removed === "2" || prev.study === "2" || prev.rec;
              if (prev.status === "архив") statusArch++;
              if (prev.removed === "2") removed2++;
              if (prev.study === "2") study2++;
              if (prev.rec) recheck++;
              if (a) any++;
            }
            console.log(JSON.stringify({ items: items.length, uniqueCrm: seen.size, noCrm, statusArch, removed2, study2, recheck, any, byStatus }));
            EOF
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            exit 0
