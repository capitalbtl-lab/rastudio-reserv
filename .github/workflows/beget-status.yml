name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            echo "=== time ==="
            date -u
            echo "=== git ==="
            cd /var/www/rastudio
            git rev-parse --short HEAD
            git log -1 --oneline
            echo "=== live stamp ==="
            cat .output/.deploy-rev 2>/dev/null | cut -c1-7
            cat .deploy-rev 2>/dev/null | cut -c1-7
            echo "=== lock ==="
            ls -l /tmp/rastudio-deploy.lock 2>/dev/null || echo no-lock
            echo "=== stage ==="
            ls -d /var/www/rastudio/.build-stage 2>/dev/null || echo no-stage
            echo "=== mem ==="
            free -h | head -2
            nproc
            echo "=== pm2 ==="
            pm2 jlist | python3 -c "import json,sys; d=json.load(sys.stdin);
            [print(p.get('name'), p.get('pm2_env',{}).get('status'), p.get('pid')) for p in d]"
            echo "=== procs ==="
            ps aux | awk '/node|npm|vite/ && !/awk/ {print $2,$3,$4,$11,$12,$13}' | head -20
            echo "=== log tail ==="
            tail -n 40 /tmp/rastudio-deploy.bg.log 2>/dev/null || echo no-log
            echo "=== pm2 err ==="
            pm2 logs rastudio --nostream --lines 40 --err 2>/dev/null | tail -40
            echo "=== node log ==="
            tail -n 40 /tmp/rastudio-node.log 2>/dev/null || echo no-node-log
            echo "=== local ==="
            curl -sS -o /tmp/local.html -w "local:%{http_code}\n" --max-time 8 http://127.0.0.1:3000/ || echo localfail
            head -c 300 /tmp/local.html 2>/dev/null; echo
            echo "=== probe ==="
            cd /var/www/rastudio
            python3 - <<'PY'
            import json
            pol=json.load(open("storage/crm-archive-policy.json"))
            print("policy", pol.get("ready"), "working", len(pol.get("working") or []))
            ver=json.load(open("storage/crm-schedule-versions.json"))
            live=set()
            rows=ver if isinstance(ver, list) else ver.get("versions") or ver.get("items") or []
            if isinstance(ver, dict) and not rows:
                print("ver keys", list(ver.keys())[:12])
            slots=[]
            if isinstance(ver, list) and ver:
                slots=(ver[0].get("slots") or []) if isinstance(ver[0], dict) else []
            elif isinstance(ver, dict):
                slots=ver.get("slots") or []
            print("slots", len(slots) if isinstance(slots, list) else type(slots))
            if isinstance(slots, list):
                for s in slots:
                    if not isinstance(s, dict):
                        continue
                    gid=int(s.get("groupId") or 0); bid=int(s.get("branchId") or 0)
                    if gid and bid: live.add((bid, gid))
            print("live_pairs", len(live))
            d=json.load(open("storage/dossiers.json"))
            hit=0
            samples=[]
            for x in d.get("items") or []:
                s=str(x.get("status") or "")
                ex=x.get("extras") or {}
                if s!="архив" and str(ex.get("removed") or "")!="2":
                    continue
                for g in x.get("groupLinks") or []:
                    if not isinstance(g, dict):
                        continue
                    gid=int(g.get("id") or g.get("groupId") or 0)
                    bid=int(g.get("branchId") or x.get("branchId") or 0)
                    if (bid, gid) in live or any(p[1]==gid for p in live):
                        hit+=1
                        if len(samples)<8:
                            samples.append((x.get("crmId"), x.get("child",{}).get("fio") if isinstance(x.get("child"), dict) else "", bid, gid, g.get("active"), g.get("name")))
                        break
            print("archive_in_live_group", hit)
            print("samples", samples)
            b=json.load(open("storage/crm-leads-board.json"))
            rows7=((b.get("keys") or {}).get("7") or {}).get("items") or []
            oks=[(r.get("id"), r.get("name"), r.get("cashState"), r.get("study")) for r in rows7 if r.get("cashState")=="ok"]
            print("cash_ok", oks[:10], "n", len(oks))
            PY
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            echo "=== two cards ==="
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs -e '
            import { readFileSync } from "fs";
            import { step7AgeYears, step7Dob, step7FioOk, step7InYears } from "./src/data/crm-step7-core.ts";
            const items = JSON.parse(readFileSync("storage/crm-leads-board.json","utf8")).keys?.["7"]?.items || [];
            const now = new Date();
            for (const id of [861, 7417]) {
              const x = items.find((c) => c.id === id) || {};
              const dob = step7Dob(x.dob, now);
              console.log(JSON.stringify({ id, study: x.study, dob, age: step7AgeYears(x.dob, now), fio: step7FioOk(x.name), year: step7InYears(String(x.archivedAt||""), 2015, now), archivedAt: x.archivedAt || "", les: x.cashLesN || 0, noCom: x.cashNoCommission || 0, pay: x.cashPayN || 0, corr: x.cashCorrN || 0, refund: x.cashRefundN || 0, branch: x.branchId }));
            }
            '
            exit 0
