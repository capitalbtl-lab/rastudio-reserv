name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            cd /var/www/rastudio
            node --input-type=module <<'EOF'
            import { readFileSync } from "node:fs";
            const raw = JSON.parse(readFileSync("storage/dossiers.json", "utf8"));
            function diskIsArchive(it) {
              if (Number(it.removed) === 1) return false;
              if (Number(it.removed) === 2) return true;
              const study = it.is_study === "" || it.is_study == null ? NaN : Number(it.is_study);
              return study === 2;
            }
            function personRole(it) {
              if (Number(it.removed) === 1) return "удалён";
              if (diskIsArchive(it)) return "архив";
              const study = it.is_study === "" || it.is_study == null ? NaN : Number(it.is_study);
              if (study === 1) return "учится";
              if (study === 0) return "лид";
              if (String(it.crm_funnel || "") === "1") return "лид";
              const st = String(it.status || "");
              if (st === "лид" || st === "учится" || st === "архив" || st === "удалён") return st;
              return "удалён";
            }
            const why = {};
            let leads = 0, arch = 0, cur = 0, rows = 0;
            let rawArchButLead = 0, study0 = 0, funnel = 0, rawLead = 0;
            for (const d of raw.items || []) {
              const ex = d.extras || {};
              const role = personRole({ is_study: ex.is_study, removed: ex.removed, crm_funnel: ex.crm_funnel, status: d.status });
              if (role === "удалён") continue;
              rows++;
              const removed = String(ex.removed || "");
              const rec = String(ex.recheckArchive || "");
              const isArch = role === "архив" || rec === "1" || removed === "2";
              if (isArch) { arch++; continue; }
              if (role === "лид") {
                leads++;
                const study = ex.is_study === "" || ex.is_study == null ? NaN : Number(ex.is_study);
                const key = study === 0 ? "is_study0" : String(ex.crm_funnel || "") === "1" ? "funnel" : "status";
                why[key] = (why[key] || 0) + 1;
                if (String(d.status) === "архив") rawArchButLead++;
                if (study === 0) study0++;
                if (String(ex.crm_funnel || "") === "1") funnel++;
                if (String(d.status) === "лид") rawLead++;
              } else if (role === "учится") cur++;
            }
            console.log(JSON.stringify({ rows, leads, arch, cur, why, rawArchButLead, study0, funnel, rawLead }));
            try {
              const board = JSON.parse(readFileSync("storage/crm-leads-board.json", "utf8"));
              const cards = board.cards || board.items || board.leads || [];
              const n = Array.isArray(cards) ? cards.length : 0;
              const keys = Object.keys(board).slice(0, 12);
              console.log(JSON.stringify({ boardKeys: keys, boardN: n, boardCount: board.count || board.total || null }));
            } catch (e) {
              console.log(JSON.stringify({ boardErr: String(e.message || e).slice(0, 120) }));
            }
            EOF
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            exit 0
