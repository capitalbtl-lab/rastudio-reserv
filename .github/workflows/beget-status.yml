name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            echo "=== time ==="
            date -u
            echo "=== git ==="
            cd /var/www/rastudio
            git rev-parse --short HEAD
            git log -1 --oneline
            echo "=== live stamp ==="
            cat .output/.deploy-rev 2>/dev/null | cut -c1-7
            cat .deploy-rev 2>/dev/null | cut -c1-7
            echo "=== lock ==="
            ls -l /tmp/rastudio-deploy.lock 2>/dev/null || echo no-lock
            echo "=== stage ==="
            ls -d /var/www/rastudio/.build-stage 2>/dev/null || echo no-stage
            echo "=== mem ==="
            free -h | head -2
            nproc
            echo "=== pm2 ==="
            pm2 jlist | python3 -c "import json,sys; d=json.load(sys.stdin);
            [print(p.get('name'), p.get('pm2_env',{}).get('status'), p.get('pid')) for p in d]"
            echo "=== procs ==="
            ps aux | awk '/node|npm|vite/ && !/awk/ {print $2,$3,$4,$11,$12,$13}' | head -20
            echo "=== log tail ==="
            tail -n 40 /tmp/rastudio-deploy.bg.log 2>/dev/null || echo no-log
            echo "=== pm2 err ==="
            pm2 logs rastudio --nostream --lines 40 --err 2>/dev/null | tail -40
            echo "=== node log ==="
            tail -n 40 /tmp/rastudio-node.log 2>/dev/null || echo no-node-log
            echo "=== local ==="
            curl -sS -o /tmp/local.html -w "local:%{http_code}\n" --max-time 8 http://127.0.0.1:3000/ || echo localfail
            head -c 300 /tmp/local.html 2>/dev/null; echo
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            echo "=== step6 open ==="
            node <<'NODE'
            const fs = require("fs");
            const path = require("path");
            const root = "/var/www/rastudio/storage";
            const board = JSON.parse(fs.readFileSync(path.join(root, "crm-leads-board.json"), "utf8"));
            const items = (board.keys && board.keys["0"] && board.keys["0"].items) || [];
            function agrees(x) {
              if (x.cashPayHole == null && x.cashDiskKnown == null) return true;
              const gaps = (x.cashPayHole || 0) + (x.cashPayExtra || 0) + (x.cashLesHole || 0) + (x.cashLesExtra || 0) + (x.cashNoId || 0) + (x.cashNoCommission || 0);
              if (gaps > 0) return false;
              if (x.cashDiskKnown === false && ((x.cashPayN || 0) > 0 || (x.cashLesN || 0) > 0)) return false;
              return true;
            }
            const seen = new Set();
            const open = [];
            for (const x of items) {
              if (seen.has(x.id)) continue;
              seen.add(x.id);
              if (x.cashState === "ok" && agrees(x)) continue;
              open.push(x);
            }
            console.log("cards", items.length, "people", seen.size, "open", open.length);
            for (const x of open) {
              console.log([
                x.id,
                x.name,
                x.cashState || "wait",
                "head=" + x.cashBalance,
                "formula=" + x.cashFormula,
                "payHole=" + (x.cashPayHole ?? ""),
                "payExtra=" + (x.cashPayExtra ?? ""),
                "lesHole=" + (x.cashLesHole ?? ""),
                "lesExtra=" + (x.cashLesExtra ?? ""),
                "noId=" + (x.cashNoId ?? ""),
                "noComm=" + (x.cashNoCommission ?? ""),
                "diskKnown=" + x.cashDiskKnown,
                "fail=" + (x.cashFail || ""),
                "giveUp=" + !!x.cashGiveUp,
                "tries=" + (x.cashTries ?? ""),
              ].join(" | "));
              console.log("  branches", String(x.cashBranches || "").slice(0, 400));
            }
            const idxPath = path.join(root, "crm-step-logs/index.json");
            const idx = fs.existsSync(idxPath) ? JSON.parse(fs.readFileSync(idxPath, "utf8")) : [];
            const runs = (Array.isArray(idx) ? idx : []).filter((r) => r && r.step === 6).slice(0, 3);
            console.log("step6 runs", runs.map((r) => r.id + " " + r.at + " left=" + (r.summary && r.summary.left)).join(" ;; "));
            const ids = new Set(open.map((x) => x.id));
            for (const r of runs.slice(0, 1)) {
              const file = path.join(root, "crm-step-logs", String(r.id).replace(/[^a-zA-Z0-9:_-]/g, "") + ".json");
              if (!fs.existsSync(file)) { console.log("no run file", file); continue; }
              const run = JSON.parse(fs.readFileSync(file, "utf8"));
              const rows = (run.rows || []).filter((row) => ids.has(row.cid));
              console.log("log rows for open", rows.length, "of", (run.rows || []).length);
              for (const row of rows) console.log("LOG", row.cid, row.name, row.result, row.note);
            }
            NODE
            exit 0
