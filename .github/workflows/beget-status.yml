name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            echo "=== time ==="
            date -u
            echo "=== git ==="
            cd /var/www/rastudio
            git rev-parse --short HEAD
            git log -1 --oneline
            echo "=== live stamp ==="
            cat .output/.deploy-rev 2>/dev/null | cut -c1-7
            cat .deploy-rev 2>/dev/null | cut -c1-7
            echo "=== lock ==="
            ls -l /tmp/rastudio-deploy.lock 2>/dev/null || echo no-lock
            echo "=== stage ==="
            ls -d /var/www/rastudio/.build-stage 2>/dev/null || echo no-stage
            echo "=== mem ==="
            free -h | head -2
            nproc
            echo "=== pm2 ==="
            pm2 jlist | python3 -c "import json,sys; d=json.load(sys.stdin);
            [print(p.get('name'), p.get('pm2_env',{}).get('status'), p.get('pid')) for p in d]"
            echo "=== procs ==="
            ps aux | awk '/node|npm|vite/ && !/awk/ {print $2,$3,$4,$11,$12,$13}' | head -20
            echo "=== log tail ==="
            tail -n 40 /tmp/rastudio-deploy.bg.log 2>/dev/null || echo no-log
            echo "=== pm2 err ==="
            pm2 logs rastudio --nostream --lines 40 --err 2>/dev/null | tail -40
            echo "=== node log ==="
            tail -n 40 /tmp/rastudio-node.log 2>/dev/null || echo no-node-log
            echo "=== local ==="
            curl -sS -o /tmp/local.html -w "local:%{http_code}\n" --max-time 8 http://127.0.0.1:3000/ || echo localfail
            head -c 300 /tmp/local.html 2>/dev/null; echo
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            echo "=== step7 filter ==="
            cat > /tmp/ra-filter.mjs <<'NODE'
            import { readFileSync } from "fs";
            import { step7Shows } from "/var/www/rastudio/src/data/crm-step7-core.ts";
            const items = JSON.parse(readFileSync("/var/www/rastudio/storage/crm-leads-board.json", "utf8")).keys?.["7"]?.items || [];
            const base = { clients: true, leads: true, dobYes: false, dobNo: false, fio: false, groupsYes: false, groupsNo: false, years: 0 };
            const n = (pick) => items.filter((x) => step7Shows(x, pick)).length;
            const lesson = (x) => (Number(x.cashLesN) || 0) + (Number(x.cashNoCommission) || 0);
            const pay = (x) => (Number(x.cashPayN) || 0) + (Number(x.cashCorrN) || 0) + (Number(x.cashRefundN) || 0);
            console.log(JSON.stringify({
              total: items.length,
              clients: items.filter((x) => x.study === 1).length,
              dob: n({ ...base, dobYes: true }),
              age: n({ ...base, dobYes: true, ageFrom: 1, ageTo: 15 }),
              fio: n({ ...base, dobYes: true, ageFrom: 1, ageTo: 15, fio: true }),
              year: n({ ...base, dobYes: true, ageFrom: 1, ageTo: 15, fio: true, years: 2015 }),
              studiedOnly: n({ ...base, groupsYes: true }),
              all: n({ ...base, dobYes: true, ageFrom: 1, ageTo: 15, fio: true, years: 2015, groupsYes: true }),
              cashRead: items.filter((x) => x.cashState && x.cashState !== "wait").length,
              withLesson: items.filter((x) => lesson(x) > 0).length,
              withPay: items.filter((x) => pay(x) > 0).length,
              both: items.filter((x) => x.study === 1 && lesson(x) > 0 && pay(x) > 0).length,
            }));
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-filter.mjs
            exit 0
