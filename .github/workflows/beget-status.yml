name: Beget status

on:
  workflow_dispatch:

jobs:
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 1m
          script: |
            set +e
            echo "=== time ==="
            date -u
            echo "=== git ==="
            cd /var/www/rastudio
            git rev-parse --short HEAD
            git log -1 --oneline
            echo "=== live stamp ==="
            cat .output/.deploy-rev 2>/dev/null | cut -c1-7
            cat .deploy-rev 2>/dev/null | cut -c1-7
            echo "=== lock ==="
            ls -l /tmp/rastudio-deploy.lock 2>/dev/null || echo no-lock
            echo "=== stage ==="
            ls -d /var/www/rastudio/.build-stage 2>/dev/null || echo no-stage
            echo "=== mem ==="
            free -h | head -2
            nproc
            echo "=== pm2 ==="
            pm2 jlist | python3 -c "import json,sys; d=json.load(sys.stdin);
            [print(p.get('name'), p.get('pm2_env',{}).get('status'), p.get('pid')) for p in d]"
            echo "=== procs ==="
            ps aux | awk '/node|npm|vite/ && !/awk/ {print $2,$3,$4,$11,$12,$13}' | head -20
            echo "=== log tail ==="
            tail -n 40 /tmp/rastudio-deploy.bg.log 2>/dev/null || echo no-log
            echo "=== pm2 err ==="
            pm2 logs rastudio --nostream --lines 40 --err 2>/dev/null | tail -40
            echo "=== node log ==="
            tail -n 40 /tmp/rastudio-node.log 2>/dev/null || echo no-node-log
            echo "=== local ==="
            curl -sS -o /tmp/local.html -w "local:%{http_code}\n" --max-time 8 http://127.0.0.1:3000/ || echo localfail
            head -c 300 /tmp/local.html 2>/dev/null; echo
            echo "=== probe ==="
            cd /var/www/rastudio
            cat > /tmp/ra-probe.mjs <<'NODE'
            async function check(name, fn) {
              try {
                const v = await fn();
                console.log(name, "ok", v || "");
              } catch (e) {
                console.error(name, "FAIL", e && e.stack ? e.stack : e);
              }
            }
            await check("layout", async () => {
              const { loadHomeLayout } = await import("/var/www/rastudio/src/data/home-layout.ts");
              const l = loadHomeLayout();
              return String(l.order?.length) + " " + String(l.order?.[0] || "");
            });
            await check("edits", async () => {
              const { ensureLiveEdits } = await import("/var/www/rastudio/src/data/edits.ts");
              ensureLiveEdits();
            });
            await check("prices", async () => {
              const { ensureLivePrices } = await import("/var/www/rastudio/src/data/prices.ts");
              ensureLivePrices();
            });
            await check("signup", async () => {
              const { loadSiteSignup } = await import("/var/www/rastudio/src/data/site-signup.ts");
              loadSiteSignup();
            });
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-probe.mjs
            echo "=== out log ==="
            ls /root/.pm2/logs/ | head
            tail -n 80 /root/.pm2/logs/rastudio-out-8.log 2>/dev/null
            tail -n 80 /root/.pm2/logs/rastudio-error-8.log 2>/dev/null
            echo "=== port ==="
            ss -ltnp | grep 3000 || echo no-3000
            echo "=== step7 cgi vs board ==="
            cat > /tmp/ra-groups.mjs <<'NODE'
            import { readFileSync } from "fs";
            import { request, token } from "/var/www/rastudio/src/data/alfacrm.ts";
            const tok = await token();
            const board = JSON.parse(readFileSync("/var/www/rastudio/storage/crm-leads-board.json", "utf8"));
            const items = new Map((board.keys?.["7"]?.items || []).map((x) => [Number(x.id), x.hadGroups === true]));
            const groups = await request("/v2api/1/group/index", { removed: 2, page: 0, pageSize: 100 }, tok);
            const gItems = Array.isArray(groups.items) ? groups.items : [];
            const sample = gItems.slice(0, 8).map((g) => Number(g.id)).filter((n) => n > 0);
            let cgiCustomers = 0;
            let onBoard = 0;
            let onBoardHad = 0;
            let past = 0;
            const errors = [];
            for (const gid of sample) {
              try {
                const json = await request(`/v2api/1/cgi/index?group_id=${gid}`, { group_id: gid, page: 0, pageSize: 100 }, tok);
                const rows = Array.isArray(json.items) ? json.items : [];
                for (const row of rows) {
                  const cid = Number(row.customer_id) || 0;
                  if (!cid) continue;
                  cgiCustomers += 1;
                  const end = String(row.e_date || "");
                  if (end && end < "2026-09-26" && !end.startsWith("0000")) past += 1;
                  if (items.has(cid)) {
                    onBoard += 1;
                    if (items.get(cid)) onBoardHad += 1;
                  }
                }
              } catch (e) {
                errors.push(e instanceof Error ? e.message.slice(0, 80) : "ошибка");
              }
            }
            console.log(JSON.stringify({
              archivedGroupsTotal: groups.total ?? gItems.length,
              groupsSampled: sample.length,
              cgiCustomers,
              past,
              onBoard,
              onBoardHad,
              errors,
            }));
            NODE
            node --experimental-strip-types --import ./scripts/ts-ext-register.mjs /tmp/ra-groups.mjs
            exit 0
