name: restore-sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore customer-sync from last good commit and patch
        run: |
          set -euo pipefail
          git checkout 76341180d4b982b1c2ddad1b8bbc26ae00c0f2c1 -- src/data/crm-customer-sync.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/data/crm-customer-sync.ts")
          t = p.read_text()
          start = t.index("/** Журнал готов по множествам id.")
          end = t.index("export const LESSON_WINDOW_STEPS")
          new = (
              "/** Журнал готов по множествам id. Цифру 491/491 не смотрим. */\n"
              "export function lessonsJournalReady(sync: CustomerSyncStamp) {\n"
              "  if (lessonsStampShort(sync)) return false;\n"
              "  if (lessonsStampExtra(sync)) return false;\n"
              "  if (sync.lessonsHoleN != null && sync.lessonsExtraN != null) {\n"
              "    return Boolean(sync.lessonsAlfaAt || (sync.lessonsFull && sync.lessonsAttend));\n"
              "  }\n"
              "  return Boolean(sync.lessonsFull && sync.lessonsAttend);\n"
              "}\n"
              "\n"
              "/** Уже сходился: short/extra нет. Окно синей от этого не зависит — extra тоже ±дни. */\n"
              "export function wasLessonGreen(sync: CustomerSyncStamp) {\n"
              "  if (lessonsStampExtra(sync)) return false;\n"
              "  if (lessonsStampShort(sync)) return false;\n"
              "  if (sync.lessonsRecheckAt) return true;\n"
              "  if (sync.lessonsFull) return true;\n"
              "  return false;\n"
              "}\n"
              "\n"
          )
          out = t[:start] + new + t[end:]
          if "unlockStudentAlfa" not in out:
              raise SystemExit("file truncated")
          if "return probed && alfa > 0 && disk === alfa" in out:
              raise SystemExit("old wasLessonGreen still present")
          p.write_text(out)
          print("bytes", len(out))
          PY
          git config user.name "capitalbtl-lab"
          git config user.email "309436821+capitalbtl-lab@users.noreply.github.com"
          git add src/data/crm-customer-sync.ts
          git diff --cached --stat
          git commit -m "Восстановить crm-customer-sync.ts целиком."
          git push origin HEAD:main
